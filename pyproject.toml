[project]
name = "trackyard"
version = "0.1.0"
description = "Passive BLE badge tracking proof of concept: shows how cleartext iBeacon conference badges let anyone reconstruct attendee movements."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "trackyard/static/*.txt"]
authors = [{ name = "tilalx" }]
requires-python = ">=3.11"
keywords = ["bluetooth", "ble", "ibeacon", "privacy", "security-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "bleak>=0.22",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
trackyard = "trackyard.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PIE", "RUF"]
ignore = [
    "B008",    # typer.Option(...) in defaults is how typer works
    "RUF001",  # en/em dashes in UI strings are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["trackyard", "conftest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackyard"]

[tool.setuptools.package-data]
trackyard = ["static/*"]
